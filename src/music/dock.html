<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IXC Music</title>
<!-- OBS custom browser dock: http://localhost:8767/music/dock.html   Controls player.html (the "IXC Music Player" browser source). -->
<style>
  :root { --red: #e3141e; --bg: #0f0e13; --card: #17161c; --line: #2a2830; --dim: #9b98a4; --tw: #9146ff; --kick: #53fc18; --yt: #ff0033; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #eeedf2; font: 13px "Bahnschrift", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 10px 6px; border-bottom: 2px solid var(--red); background: #16161b; }
  .row { display: flex; gap: 6px; align-items: center; }
  input[type=text] { flex: 1; min-width: 0; background: #0c0b10; border: 1px solid var(--line); color: #fff; border-radius: 7px; padding: 6px 8px; font: inherit; }
  button { background: #1f1e25; border: 1px solid #34323c; color: #e8e7ec; border-radius: 7px; padding: 5px 9px; font: 600 12px "Bahnschrift", sans-serif; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #55525e; } button.red { background: var(--red); border-color: var(--red); color: #fff; } button.on { background: var(--red); border-color: var(--red); }
  button:disabled { opacity: .5; cursor: default; }
  #now { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  #now img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #000; flex: none; }
  #nowT { font-weight: 600; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #nowS { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #bar { height: 3px; background: #2a2830; border-radius: 2px; margin-top: 6px; overflow: hidden; } #bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width 1s linear; }
  .ctrl { margin-top: 7px; } .ctrl input[type=range] { flex: 1; min-width: 50px; accent-color: var(--red); }
  /* audio destination */
  #routeL { margin-top: 8px; font-size: 11px; color: var(--dim); }
  #route { margin-top: 4px; display: grid; grid-template-columns: .7fr 1fr 1fr 1.1fr; gap: 4px; }
  #route button { padding: 5px 2px; font-size: 11px; letter-spacing: .3px; }
  #route button.sel { color: #fff; } #route button.sel[data-m=all] { background: var(--red); border-color: var(--red); }
  #route button.sel[data-m=twitch] { background: var(--tw); border-color: var(--tw); } #route button.sel[data-m=kick] { background: var(--kick); border-color: var(--kick); color: #0a0a0a; }
  #route button.sel[data-m=youtube] { background: var(--yt); border-color: var(--yt); } #route button.sel[data-m=off] { background: #444; }
  #routeS { font-size: 11px; margin-top: 4px; color: var(--dim); } #routeS.bad { color: #ffcf6b; } #routeS.ok::before { content: "✓ "; color: #6be38a; }
  #tabs { display: flex; gap: 4px; padding: 6px 10px 0; } #tabs button { flex: 1; } #tabs button.sel { background: #2a2830; border-color: #55525e; }
  main { flex: 1; overflow-y: auto; padding: 6px 8px 10px; }
  main::-webkit-scrollbar { width: 6px; } main::-webkit-scrollbar-thumb { background: #3a3842; border-radius: 3px; }
  .it { display: flex; gap: 8px; align-items: center; padding: 5px; border-radius: 7px; background: var(--card); margin-top: 5px; border: 1px solid transparent; }
  .it.cur { border-color: var(--red); } .it img { width: 56px; height: 32px; object-fit: cover; border-radius: 4px; flex: none; background: #000; }
  .it .t { flex: 1; min-width: 0; } .it .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .t small { color: var(--dim); } .it button { padding: 3px 7px; }
  .sp { display: inline-block; font: 700 9px Bahnschrift; background: #1db954; color: #000; border-radius: 3px; padding: 0 3px; margin-right: 3px; vertical-align: 1px; }
  #status { padding: 3px 10px; font-size: 11px; color: #ffb4b4; background: #3a0f12; display: none; } #status.show { display: block; }
  #msg { display: none; margin-top: 6px; font-size: 12px; line-height: 1.35; padding: 6px 8px; border-radius: 7px; background: #231f14; color: #ffdf9b; border: 1px solid #4a3f1d; white-space: pre-line; }
  #msg.ok { background: #13231a; color: #a8f0c0; border-color: #1f4a2d; } #msg.show { display: block; } #msg button { margin-top: 5px; }
  #note { display: none; margin-top: 6px; font-size: 11px; color: #ffcf6b; }
  .hint { color: var(--dim); padding: 10px 4px; line-height: 1.4; }
  #tools { margin-left: auto; display: flex; gap: 4px; } #tools button { padding: 3px 7px; }
</style>
</head>
<body>
<header>
  <div class="row"><input id="q" type="text" placeholder="Search, or paste a YouTube / Spotify link (song or playlist)"><button id="go" class="red">Go</button></div>
  <div id="msg"></div>
  <div id="now"><img id="nowI" alt=""><div style="min-width:0;flex:1"><div id="nowT">Nothing playing</div><div id="nowS">plays through the "IXC Music Player" source in OBS</div></div></div>
  <div id="bar"><i></i></div>
  <div class="row ctrl"><button id="prev" title="Previous">&#9198;</button><button id="toggle" title="Play / pause">&#9199;</button><button id="next" title="Next">&#9197;</button>
    <button id="shuf" title="Shuffle">&#128256;</button><button id="rep" title="Repeat the queue">&#128257;</button><button id="auto" title="Autoplay: when the queue ends, keep playing similar songs">Autoplay</button><span>&#128266;</span><input id="vol" type="range" min="0" max="100" value="40"></div>
  <div id="routeL">Music goes to</div><div id="route"><button data-m="all" title="Send the music to all your stream outputs">ALL</button><button data-m="twitch" title="Only viewers on Twitch hear the music">TWITCH ONLY</button><button data-m="kick" title="Only viewers on Kick hear the music">KICK ONLY</button><button data-m="youtube" title="Only viewers on YouTube hear the music">YOUTUBE ONLY</button></div>
  <div id="routeS">checking OBS…</div>
  <div class="row" style="margin-top:6px;font-size:11px;color:var(--dim)"><label style="display:flex;gap:5px;align-items:center;cursor:pointer"><input id="astart" type="checkbox" style="accent-color:var(--red)"> Start music by itself when OBS opens</label>
    <span id="tools"><button id="phoneBtn" title="Control IXC from your phone (works on mobile data)">&#128241;</button><button id="diagBtn" title="Diagnostics">&#9432;</button></span></div>
  <div id="note"></div>
</header>
<div id="status">Music player not connected - is OBS open with the "IXC Music Player" browser source (http://localhost:8767/music/player.html)?</div>
<div id="tabs"><button id="tQueue" class="sel">Queue</button><button id="tResults">Results</button></div>
<main id="list"></main>
<script src="/core/ixc.js"></script>
<script src="/core/phone.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let state = {}, route = {}, results = [], tab = 'queue', lastQueueJson = '', stateAt = 0, coreUp = false;
const thumb = (it) => it && it.id ? `https://i.ytimg.com/vi/${it.id}/mqdefault.jpg` : '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const link = IXC.connect({ role: 'musicdock', topics: ['music.state', 'reload'], on: onMsg, onState: (up) => { coreUp = up; paint(); } });
const send = (c) => link.send({ type: 'music.cmd', c });
const isLink = (s) => /^(https?:\/\/|www\.)|youtu\.?be|spotify[.:]|[?&]list=/i.test(s) || /^[\w-]{11}$/.test(s) && /[0-9_-]|[A-Z].*[a-z]/.test(s);

function onMsg(m) {
  if (m.type === 'music.state') { state = m.s || {}; stateAt = Date.now(); paint(); renderQueue(); }
  else if (m.type === 'music.route') { route = m; paintRoute(); }
}
let msgT; function note(text, ok, action) {
  const b = $('msg'); clearTimeout(msgT); if (!text) { b.classList.remove('show'); return; }
  b.className = 'show' + (ok ? ' ok' : ''); b.innerHTML = esc(text) + (action ? `<br><button id="msgAct">${esc(action.label)}</button> <button id="msgNo">Dismiss</button>` : '');
  if (action) { $('msgAct').onclick = () => { note(''); action.run(); }; $('msgNo').onclick = () => note(''); } else msgT = setTimeout(() => b.classList.remove('show'), ok ? 4000 : 10000);
}
async function addLink(url, mode, force) {
  note('Checking the link…', true); $('go').disabled = true;
  const r = await link.ask({ type: 'music.add', url, mode: mode || 'add', force: !!force }, 'music.added', 60000); $('go').disabled = false;
  if (r.ok) { note(`✓ ${mode === 'playnow' ? 'Playing' : 'Added'}: ${r.title}${r.items ? ' (' + r.items.length + ' songs)' : ''}${r.note ? '\n' + r.note : ''}`, true); $('q').value = ''; setTab('queue'); }
  else if (r.code === 'duplicate') note(r.error, false, { label: 'Add it again', run: () => addLink(url, mode, true) });
  else note('✗ ' + (r.error || 'That link could not be used.'));
}
async function search() {
  const s = $('q').value.trim(); if (!s) return;
  if (isLink(s)) return addLink(s, 'add');
  $('list').innerHTML = '<div class="hint">Searching…</div>'; setTab('results', true);
  const r = await link.ask({ type: 'music.search', q: s }, 'music.results', 25000); results = r.results || [];
  if (r.error) note('✗ Search failed: ' + r.error);
  renderResults();
}
function renderResults() {
  if (tab !== 'results') return;
  $('list').innerHTML = results.length ? results.map((r, i) => `<div class="it"><img src="${thumb(r)}" alt=""><div class="t"><b title="${esc(r.title)}">${esc(r.title)}</b><small>${esc(r.channel)} ${r.length ? '· ' + esc(r.length) : ''}</small></div>
      <button data-a="playnow" data-i="${i}" title="Play now">&#9654;</button><button data-a="add" data-i="${i}" title="Add to queue">+</button></div>`).join('')
    : '<div class="hint">No results. Try other words, or paste a YouTube / Spotify link.</div>';
}
function renderQueue() {
  if (tab !== 'queue') return;
  const q = state.queue || [], j = JSON.stringify([q, state.index]); if (j === lastQueueJson) return; lastQueueJson = j;
  $('list').innerHTML = q.length ? q.map((it, i) => `<div class="it ${i === state.index ? 'cur' : ''}" style="${it.bad ? 'opacity:.55' : ''}"><img src="${thumb(it)}" alt=""><div class="t"><b title="${esc(it.title || it.id || 'Playlist')}">${it.from === 'spotify' ? '<span class="sp">SPOTIFY</span>' : ''}${esc(it.title || (it.list ? 'YouTube playlist' : it.id || it.q))}</b><small>${it.bad ? '⚠ ' + esc(it.why || "can't play here") + ' - ▶ to retry' : (it.list ? 'playlist' : (i === state.index ? 'now playing' : '#' + (i + 1)) + (it.auto ? ' · autoplay' : '') + (!it.id && it.q ? ' · matched on YouTube when it plays' : ''))}</small></div>
      <button data-a="jump" data-i="${i}" title="Play">&#9654;</button>${i > 0 ? `<button data-a="up" data-i="${i}" title="Move up">&#8593;</button>` : ''}<button data-a="remove" data-i="${i}" title="Remove">&#10005;</button></div>`).join('')
    : '<div class="hint">Queue is empty.<br>Search above (e.g. "NCS gaming mix", "StreamBeats lofi") and press ▶ or +, or paste a YouTube / Spotify song or playlist link.<br><br>Safest music for streams: NCS and StreamBeats.</div>';
}
function setTab(t, keep) { tab = t; $('tQueue').classList.toggle('sel', t === 'queue'); $('tResults').classList.toggle('sel', t === 'results'); lastQueueJson = ''; if (!keep) (t === 'queue' ? renderQueue : renderResults)(); }
$('list').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i, a = b.dataset.a;
  if (a === 'playnow' || a === 'add') { const r = results[i]; send({ cmd: a, item: { id: r.id, title: r.title } }); b.textContent = '✓'; }
  else if (a === 'up') send({ cmd: 'move', from: i, to: i - 1 }); else send({ cmd: a, i }); });
$('go').onclick = search; $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
$('toggle').onclick = () => send({ cmd: 'toggle' }); $('next').onclick = () => send({ cmd: 'next' }); $('prev').onclick = () => send({ cmd: 'prev' });
$('shuf').onclick = () => send({ cmd: 'shuffle', on: !state.shuffle });
$('rep').onclick = () => send({ cmd: 'repeat', on: !state.repeat });
$('auto').onclick = () => send({ cmd: 'autoplay', on: state.autoplay === false });
$('astart').onchange = () => send({ cmd: 'autostart', on: $('astart').checked });
let volT; $('vol').oninput = () => { clearTimeout(volT); volT = setTimeout(() => send({ cmd: 'volume', v: +$('vol').value }), 120); };
$('tQueue').onclick = () => setTab('queue'); $('tResults').onclick = () => setTab('results');
let dragging = false; $('vol').onpointerdown = () => dragging = true; $('vol').onpointerup = () => dragging = false;
document.querySelectorAll('#route button').forEach(b => b.onclick = async () => {
  $('routeS').textContent = 'switching…'; $('routeS').className = '';
  const r = await link.ask({ type: 'music.route', mode: b.dataset.m }, 'music.routed', 15000);
  if (r.result && !r.result.ok && !r.result.pending) note('✗ ' + (r.result.error || 'OBS did not take the change'));
});
$('phoneBtn').onclick = () => IXCPhone.open();
$('diagBtn').onclick = () => window.open('/core/diag.html', '_blank');

function paintRoute() {
  document.querySelectorAll('#route button').forEach(b => b.classList.toggle('sel', b.dataset.m === route.mode));
  const s = $('routeS'); s.textContent = route.status || ''; s.className = route.ok ? 'ok' : 'bad';
  if (route.ok) s.textContent = (route.mode === 'all' ? 'Everyone hears the music' : `Only ${route.mode === 'youtube' ? 'YouTube' : route.mode[0].toUpperCase() + route.mode.slice(1)} viewers hear the music`) + ` · OBS ${route.tracks}`;
}
function paint() {
  const alive = coreUp && state.t && state.ready && (!state.playing || Date.now() - stateAt < 20000);
  $('status').classList.toggle('show', !alive); $('status').textContent = coreUp ? 'Music player not connected - is OBS open with the "IXC Music Player" browser source?' : 'IXC is not running - Start menu › IXC for OBS › Start IXC';
  const it = (state.queue || [])[state.index];
  $('nowT').textContent = state.title || (it && (it.title || (it.list ? 'YouTube playlist' : ''))) || 'Nothing playing';
  $('nowS').textContent = (state.playing ? '▶ playing' : '⏸ paused') + ' · IXC Music';
  $('nowI').src = it && it.id ? thumb(it) : ''; $('toggle').innerHTML = state.playing ? '&#9208;' : '&#9654;';
  $('shuf').classList.toggle('on', !!state.shuffle); $('rep').classList.toggle('on', state.repeat !== false); $('auto').classList.toggle('on', state.autoplay !== false); if (document.activeElement !== $('astart')) $('astart').checked = !!state.autostart; if (!dragging && state.volume != null) $('vol').value = state.volume;
  $('note').style.display = state.note ? 'block' : 'none'; $('note').textContent = state.note || '';
  bar();
}
// progress bar moves locally between the player's updates (no network traffic)
function bar() { const pos = (state.pos || 0) + (state.playing ? (Date.now() - (state.t || Date.now())) / 1000 : 0); $('bar').firstElementChild.style.width = state.dur ? Math.min(100, 100 * pos / state.dur) + '%' : '0'; }
setInterval(() => { if (state.playing && !document.hidden) bar(); }, 1000);
renderQueue();
</script>
</body>
</html>
