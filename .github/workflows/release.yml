name: Release
# IXC Music is part of IXC 3 (Music + ChatBox in one program), which is built and tested in infernoxc/ixc-chatbox.
# A release here (tag vX.Y.Z) attaches the same files as the ixc-chatbox release with that tag, so people who come
# to this repository get the same installer.
on:
  push:
    tags: ["v*.*.*"]
  # "Run workflow" on the Actions page: make (or refresh) the release here for an ixc-chatbox tag, e.g. v3.0.3
  workflow_dispatch:
    inputs:
      tag:
        description: "IXC release tag, e.g. v3.0.3"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Attach the IXC 3 files from the ixc-chatbox release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="${{ inputs.tag || github.ref_name }}"
          # the ixc-chatbox release builds and tests its installer first (about 5 minutes): wait for it, up to 30 minutes
          for i in $(seq 1 60); do
            gh release download "$t" -R infernoxc/ixc-chatbox -D dist -p 'IXC-Setup-*.exe' -p 'IXC-Suite-*.zip' -p 'SHA256SUMS.txt' --clobber 2>/dev/null || true
            if ls dist/IXC-Setup-*.exe >/dev/null 2>&1 && [ -f dist/SHA256SUMS.txt ]; then break; fi
            echo "waiting for the $t release of infernoxc/ixc-chatbox ($i/60)"; sleep 30
          done
          ls dist/IXC-Setup-*.exe dist/SHA256SUMS.txt
          (cd dist && sha256sum -c --ignore-missing SHA256SUMS.txt)   # the same files, unchanged
          notes="docs/release-notes/$t.md"; [ -f "$notes" ] || { echo "IXC Music is part of IXC $t. Download and details: https://github.com/infernoxc/ixc-chatbox/releases/tag/$t" > /tmp/notes.md; notes=/tmp/notes.md; }
          if gh release view "$t" >/dev/null 2>&1; then gh release upload "$t" dist/* --clobber
          else gh release create "$t" dist/* --title "IXC $t (Music + ChatBox)" --notes-file "$notes"; fi
