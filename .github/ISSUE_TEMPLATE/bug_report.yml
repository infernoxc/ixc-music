name: Bug report
description: Something doesn't work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! **Never paste your config.json, phone_key.txt, Streamer.bot password or stream keys.**"
  - type: dropdown
    id: part
    attributes: { label: Which part?, options: [Search, Queue / playback, Autoplay, Dock, Installer / uninstaller, Other] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What you did, what you expected, and what happened instead. }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, placeholder: "1.0.0, Windows 11 24H2, OBS 32.2.2" }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Contents of %LOCALAPPDATA%\\IXC-OBS\\helper.log and http://localhost:8767/api/log (remove anything private)."
      render: text
